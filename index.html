<!--
檔案用途：個人服務門牌首頁 (Core Services & Digital Portal)
所在層：sunpochin.github.io/index.html；全站頂層入口
主要關聯：連結至核心照護工具 (家健錄) 與 Work 履歷頁 (/work/)
-->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO 與社群分享 Meta 設定 -->
  <title>SunPoChin 孫柏青| 數位首頁</title>
  <meta name="description" content="孫柏青的個人服務門牌，提供家健錄 JiaJian Log 家人的健康與照護紀錄。">
  <meta name="keywords" content="SunPoChin, 門牌, 家健錄, JiaJian Log, Family Health Log, 照護紀錄">
  <meta name="author" content="SunPoChin">
  
  <!-- Open Graph / Facebook / LINE 分享卡片資訊 -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sunpochin.github.io/">
  <meta property="og:title" content="孫柏青 | 數位首頁">
  <meta property="og:description" content="包含家健錄 JiaJian Log 家人的健康與照護紀錄。">
  
  <!-- 向量 SVG 門牌圖示 -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- 樣式表引入 -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 門牌標頭區塊 Header -->
  <header class="site-header">
    <div class="container">
      
      <!-- 門牌全站膠囊導覽列 Nav Bar (隱藏 Life 連結，專注提供 Work 履歷入口) -->
      <!-- 說明「為什麼這樣做」：依使用者指示將 Life 頁面暫時隱藏，導覽僅保留 Work 履歷入口 -->
      <nav class="portal-nav" aria-label="門牌頁面導覽">
        <a href="./work/" class="nav-item">
          <span class="nav-icon">💻</span>
          <span>Work 履歷</span>
        </a>
      </nav>

      <div class="brand-badge">
        <span class="brand-dot"></span>
        <span class="brand-domain">sunpochin.xyz</span>
      </div>
      <h1 class="site-title">SunPoChin 服務入口</h1>
      <p class="site-subtitle">精簡極速的數位門牌。整合核心照護工具與工程作品集。</p>
    </div>
  </header>

  <!-- 主要服務卡片區塊 Main Content -->
  <main class="main-content">
    <div class="container">

      <!-- 
        核心照護與數位工具 (Core Care Services)
        維持高顯眼度單張大卡片，突顯家健錄 JiaJian Log 作為正經事的優先層級。
      -->
      <section class="section-block" aria-label="核心照護服務">
        <div class="section-header">
          <h2 class="section-title">
            <span aria-hidden="true">🩺</span> 核心照護與數位工具
          </h2>
          <span class="section-badge">正經事 Core</span>
        </div>

        <!-- 採用家健錄 JiaJian Log 全新品牌識別與副標，提供明確的家庭照護與血壓/用藥紀錄入口 -->
        <article class="service-card" data-id="jiaJianLog">
          <div class="card-header">
            <div class="card-icon-wrapper" aria-hidden="true">
              <!-- SVG 脈搏心律圖示 -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
              </svg>
            </div>
            <span class="status-badge status-active">公開使用</span>
          </div>
          <div class="card-title-group">
            <h3 class="card-title">家健錄 JiaJian Log <span class="card-subtitle">Family Health Log</span></h3>
            <span class="card-domain">jia-jian-log.vercel.app</span>
          </div>
          <p class="card-summary">家健錄 JiaJian Log 家人的健康與照護紀錄。輕鬆紀錄每日血壓趨勢與用藥提醒，隨時追蹤家庭健康數據。</p>
          <div class="card-target-box">
            <span class="card-target-label">適合誰使用</span>
            <p class="card-target-text">需要定期紀錄血壓與用藥時程的高血壓患者、長輩或照護者。</p>
          </div>
          <div class="card-action">
            <a href="https://jia-jian-log.vercel.app/" target="_blank" rel="noopener noreferrer" class="btn-open">
              <span class="btn-text">血壓與用藥紀錄</span>
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </a>
          </div>
        </article>
      </section>

    </div>
  </main>

  <!-- 頁尾 Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year">2026</span> SunPoChin. All rights reserved.</p>
    </div>
  </footer>

  <!-- 原生 Vanilla JS 腳本水合處理 -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const yearEl = document.getElementById('year');
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      fetch('services.json')
        .then(response => response.ok ? response.json() : null)
        .then(data => {
          if (!data) return;
          const coreItems = Array.isArray(data) ? data : (data.core || []);
          coreItems.forEach(item => {
            const card = document.querySelector(`.service-card[data-id="${item.id}"]`);
            if (card) {
              const titleEl = card.querySelector('.card-title');
              const domainEl = card.querySelector('.card-domain');
              const summaryEl = card.querySelector('.card-summary');
              const targetEl = card.querySelector('.card-target-text');
              const linkEl = card.querySelector('.btn-open');
              const btnTextEl = card.querySelector('.btn-text');

              if (titleEl) {
                if (item.subtitle) {
                  titleEl.innerHTML = `${item.name} <span class="card-subtitle">${item.subtitle}</span>`;
                } else {
                  titleEl.textContent = item.name;
                }
              }
              if (domainEl) domainEl.textContent = item.domain;
              if (summaryEl) summaryEl.textContent = item.summary;
              if (targetEl) targetEl.textContent = item.targetAudience;
              if (linkEl) linkEl.href = item.url;
              if (btnTextEl && item.buttonText) btnTextEl.textContent = item.buttonText;
            }
          });
        })
        .catch(err => console.log('Using static card fallback:', err.message));
    });
  </script>
</body>
</html>
