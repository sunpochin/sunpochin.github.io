<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO 與社群分享 Meta 設定 -->
  <title>SunPoChin | 數位服務門牌</title>
  <meta name="description" content="SunPoChin 的個人與家庭數位健康工具門牌，提供血壓與用藥紀錄服務。">
  <meta name="keywords" content="SunPoChin, 門牌, 血壓紀錄, bp-722">
  <meta name="author" content="SunPoChin">
  
  <!-- Open Graph / Facebook / LINE 分享卡片資訊 -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sunpochin.github.io/">
  <meta property="og:title" content="SunPoChin | 數位服務門牌">
  <meta property="og:description" content="首頁是門牌，簡單極速。提供血壓與用藥紀錄。">
  
  <!-- 向量 SVG 門牌圖示 -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- 樣式表引入 -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 門牌標頭區塊 Header -->
  <header class="site-header">
    <div class="container">
      <div class="brand-badge">
        <span class="brand-dot"></span>
        <span class="brand-domain">sunpochin.xyz</span>
      </div>
      <h1 class="site-title">SunPoChin 服務入口</h1>
      <p class="site-subtitle">精簡極速的服務門牌。按鈕明確標示服務名稱，讓網址回到最單純的底層門牌。</p>
    </div>
  </header>

  <!-- 主要服務卡片區塊 Main Content -->
  <main class="main-content">
    <div class="container">
      <!-- 
        服務網格容器 (Services Grid): 
        門牌首頁僅保留單一核心服務「血壓與用藥紀錄」(bp-722.vercel.app)。
        其他工程作品與履歷獨立置於 /work/ 頁面。
      -->
      <section id="services-grid" class="services-grid" aria-label="服務項目列表">
        
        <!-- 單一服務卡片: 血壓與用藥紀錄 -->
        <article class="service-card" data-id="bp">
          <div class="card-header">
            <div class="card-icon-wrapper" aria-hidden="true">
              <!-- SVG 脈搏心律圖示 -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
              </svg>
            </div>
            <span class="status-badge status-active">公開使用</span>
          </div>
          <div class="card-title-group">
            <h2 class="card-title">照護記 CareTrail</h2>
            <p class="card-subtitle">家庭健康與用藥紀錄</p>
            <span class="card-domain">caretrail.vercel.app</span>
          </div>
          <p class="card-summary">輕鬆紀錄每日血壓趨勢與用藥提醒，隨時追蹤健康數據。</p>
          <div class="card-target-box">
            <span class="card-target-label">適合誰使用</span>
            <p class="card-target-text">需要定期紀錄血壓與用藥時程的高血壓患者、長輩或照護者。</p>
          </div>
          <div class="card-action">
            <a href="https://caretrail.vercel.app" target="_blank" rel="noopener noreferrer" class="btn-open">
              <span class="btn-text">血壓與用藥紀錄</span>
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </a>
          </div>
        </article>

      </section>
    </div>
  </main>

  <!-- 頁尾 Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year">2026</span> SunPoChin. All rights reserved.</p>
    </div>
  </footer>

  <!-- 原生 Vanilla JS 腳本水合處理 -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const yearEl = document.getElementById('year');
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      fetch('services.json')
        .then(response => {
          if (!response.ok) throw new Error('HTTP error ' + response.status);
          return response.json();
        })
        .then(services => {
          if (!Array.isArray(services) || services.length === 0) return;
          const item = services[0];
          const card = document.querySelector(`.service-card[data-id="${item.id}"]`);
          if (card) {
            const titleEl = card.querySelector('.card-title');
            const domainEl = card.querySelector('.card-domain');
            const summaryEl = card.querySelector('.card-summary');
            const targetEl = card.querySelector('.card-target-text');
            const linkEl = card.querySelector('.btn-open');
            const btnTextEl = card.querySelector('.btn-text');

            if (titleEl) titleEl.textContent = item.name;
            if (domainEl) domainEl.textContent = item.domain;
            if (summaryEl) summaryEl.textContent = item.summary;
            if (targetEl) targetEl.textContent = item.targetAudience;
            if (linkEl) linkEl.href = item.url;
            if (btnTextEl && item.buttonText) btnTextEl.textContent = item.buttonText;
          }
        })
        .catch(err => {
          console.log('Using static card fallback:', err.message);
        });
    });
  </script>
</body>
</html>
