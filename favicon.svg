<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- SVG 門牌徽章設計：使用深底配高對比漸層光弧，象徵數位門牌入口 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#334155" stroke-width="8" opacity="0.6" />

  <!-- 門牌幾何線條：家屋頂標誌與數位鏈接點 -->
  <g transform="translate(0, 10)">
    <path d="M 256 120 L 380 220 V 380 Q 380 392 368 392 H 144 Q 132 392 132 380 V 220 Z" fill="none" stroke="url(#doorGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <circle cx="256" cy="270" r="32" fill="url(#doorGrad)" />
    <path d="M 256 302 V 392" stroke="url(#doorGrad)" stroke-width="20" stroke-linecap="round" />
  </g>
</svg>
