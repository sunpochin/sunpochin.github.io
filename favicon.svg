<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    網站圖示 (Favicon)：
    以音樂符號 (Musical Note Emoji 🎵) 為全站識別，彰顯 Salsa DJ (Pachinko) 與雙人舞音樂生活定位。
    使用置中對齊 (text-anchor="middle" 與 dominant-baseline="central")，確保在各作業系統與瀏覽器分頁列皆呈現清晰視覺。
  -->
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-size="80">🎵</text>
</svg>
